
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d0d0d">

    <title>PortHub Switch — каталог портов</title>

    <link rel="stylesheet" href="assets/styles.css">
</head>

<body>

    <!-- Шапка сайта -->

    <header>
        <div class="top">

            <!-- Логотип -->

            <a class="brand" href="#home" aria-label="На главную">
                <span class="logo" id="logo"></span>
                <span>
                    <strong>Port<span class="brand-hub">Hub</span></strong>
                    <small>Switch</small>
                </span>
            </a>

            <!-- Главное меню -->

            <nav class="nav">
                <a href="#home" class="active">Главная</a>
                <a href="#catalog">Каталог</a>
                <a href="#platforms">Платформы</a>
            </nav>

            <!-- Кнопки в шапке -->

            <div class="top-right">

                <!-- Подписка на YouTube -->

                <a class="button subscribe-btn"
                   href="https://www.youtube.com/@naYadre"
                   target="_blank"
                   rel="noopener noreferrer"
                   title="Подписаться на канал"
                   aria-label="Подписаться на канал">

                    <span>Подписаться на канал</span>

                </a>

                <!-- Предложить порт -->

                <a class="button"
                   href="https://t.me/atomiccat404"
                   target="_blank"
                   rel="noopener noreferrer"
                   id="contact">

                    <span>Предложить порт</span>

                </a>

                <!-- Вход в админку -->

                <a class="iconbtn"
                   href="#admin"
                   title="Вход администратора"
                   aria-label="Вход администратора"
                   id="adminlink">
                </a>

            </div>
        </div>
    </header>

    <!-- Основное содержимое сайта -->

    <main id="app" class="container"></main>

    <!-- Подвал сайта -->

    <footer class="footer">
        <div class="container"
             style="display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    text-align: center;
                    gap: 8px;">

            <span>
                Проект канала
                <a href="https://www.youtube.com/@naYadre"
                   target="_blank"
                   rel="noopener noreferrer"
                   style="color: #ff9900; font-weight: 600;">
                    На Ядре
                </a>
            </span>

            <span>
                Огромное спасибо Soult414 и всем остальным!
            </span>

        </div>
    </footer>

    <!-- Всплывающие уведомления -->

    <div id="toast" class="toast hidden" role="status"></div>

    <!-- Подключение скриптов -->

    <script src="config.js"></script>
    <script src="assets/icons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
    <script src="assets/cloud.js"></script>
    <script src="assets/app.js"></script>

</body>

</html>
