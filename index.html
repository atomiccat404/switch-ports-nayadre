
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d0d0d">

    <title>PortHub Switch — каталог портов</title>

    <link rel="stylesheet" href="assets/styles.css">

    <style>
        /* Оформление подвала */

        .footer .footer-layout {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 24px;
        }

        .footer-left {
            text-align: left;
        }

        .footer-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 6px;
        }

        .footer-right {
            text-align: right;
        }

        .footer-center a {
            color: #ff9900;
            font-weight: 600;
            text-decoration: none;
        }

        .footer-center a:hover {
            color: #ffb333;
            text-decoration: underline;
        }

        /* Адаптация под мобильные устройства */

        @media (max-width: 900px) {
            .footer .footer-layout {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .footer-left,
            .footer-center,
            .footer-right {
                text-align: center;
            }

            .footer-center {
                grid-row: 1;
            }
        }
    </style>
</head>

<body>

    <!-- Шапка сайта -->

    <header>
        <div class="top">

            <!-- Логотип -->

            <a class="brand brand-image" href="#home" aria-label="На главную">

    <span id="logo" hidden style="display: none !important;"></span>

    <img src="assets/logo2.svg"
         alt="PortHub Switch"
         class="site-logo">

</a>

            <!-- Главное меню -->

            <nav class="nav">
                <a href="#home" class="active">Главная</a>
                <a href="#catalog">Каталог</a>
                <a href="#platforms">Платформы</a>
            </nav>

            <!-- Кнопки в шапке -->

            <div class="top-right">

                <!-- Подписка на YouTube -->

<a class="button subscribe-btn"
   href="https://www.youtube.com/@naYadre"
   target="_blank"
   rel="noopener noreferrer"
   title="Подписаться на канал"
   aria-label="Подписаться на канал">

    <svg viewBox="0 0 24 24"
         fill="currentColor"
         aria-hidden="true">
        <path fill-rule="evenodd"
              d="M6 4h12a5 5 0 0 1 5 5v6a5 5 0 0 1-5 5H6a5 5 0 0 1-5-5V9a5 5 0 0 1 5-5z
                 M10 8v8l6-4z"/>
    </svg>

    <span>Подписаться на канал</span>

                </a>

                <!-- Предложить порт -->

                <a class="button"
                   href="https://t.me/atomiccat404"
                   target="_blank"
                   rel="noopener noreferrer"
                   id="contact">
                    <span>Предложить порт</span>
                </a>

                <!-- Вход в админку -->

                <a class="iconbtn"
                   href="#admin"
                   title="Вход администратора"
                   aria-label="Вход администратора"
                   id="adminlink">
                </a>

            </div>
        </div>
    </header>

    <!-- Основное содержимое сайта -->

    <main id="app" class="container"></main>

    <!-- Подвал сайта -->

    <footer class="footer">
        <div class="container footer-layout">

            <!-- Левая часть -->

            <div class="footer-left">
                © 2026 PortHub Switch · Независимый каталог
            </div>

            <!-- Центральная часть -->

            <div class="footer-center">
                <span>
                    Проект канала
                    <a href="https://www.youtube.com/@naYadre"
                       target="_blank"
                       rel="noopener noreferrer">На Ядре</a>
                </span>

                <span>
                    Огромное спасибо Soult414 и всем остальным!
                </span>
            </div>

            <!-- Правая часть -->

            <div class="footer-right">
                Не связан с Nintendo ·
                <a href="https://t.me/atomiccat404"
                   target="_blank"
                   rel="noopener noreferrer">Обратная связь</a>
            </div>

        </div>
    </footer>

    <!-- Всплывающие уведомления -->

    <div id="toast" class="toast hidden" role="status"></div>

    <!-- Подключение скриптов -->

    <script src="config.js"></script>
    <script src="assets/icons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
    <script src="assets/cloud.js"></script>
    <script src="assets/app.js"></script>

</body>

</html>
